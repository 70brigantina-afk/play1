<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ЛАЗЕРГРАНД — профессиональный ремонт очков в Москве: лазерная сварка титана и стали, ремонт пластика, замена дужек и линз, ремонт сложных оправ.">
  <title>ЛАЗЕРГРАНД — ремонт очков в Москве и по России</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div style="min-height:100vh;display:grid;place-items:center;background:#111313;color:#f8f3e8;font:16px Arial,sans-serif">Загрузка сайта…</div>
  <script>
  (async()=>{
    try{
      const names=['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt','p6.txt','p7.txt','p8.txt'];
      const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{
        if(!r.ok) throw new Error(n+' '+r.status);
        return r.text();
      })));
      document.body.innerHTML=parts.join('').replace(/<script src="script\.js"><\/script>/,'');
      const s=document.createElement('script');
      s.src='script.js';
      document.body.appendChild(s);
    }catch(e){
      document.body.innerHTML='<main style="max-width:760px;margin:80px auto;padding:30px;font:16px Arial,sans-serif"><h1>Сайт временно не загрузился</h1><p>Обновите страницу. Техническая информация: '+String(e)+'</p></main>';
    }
  })();
  </script>
</body>
</html>
